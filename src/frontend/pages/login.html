<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Login - Arremata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles/login.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <img src="../components/Imagens/Logo_Arremata_Dark.png" alt="Logo Arremata" class="logo-extra">

      <form id="login-form">

        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Email ou RG" required/>

        <label for="senha">Senha:</label>
        <input id="senha" name="senha" type="password" required />

        <button type="submit">Entrar</button>

        <div id="msg-cadastro" class="msg-cadastro">
          <p>Não tem cadastro? <a href="../pages/Cadastro.html" class="register-link">Crie sua conta</a></p>
        </div>
      </form>
    </section>
  </main>

</body>
</html>
